services:  # Defines the services (Docker containers) that will be run.
  # These not be limited to

  #<name_of_service>: # This is how we declare the "service" aka process we want to create an image of
  #image: chatserver:latest  # The Docker image name and tag used to run this service
  #build:
  #context: ./chatserver  # The directory containing the Dockerfile for building this service
  #dockerfile: Dockerfile  # The specific Dockerfile to use for building the image
  #volumes:
  #- db_data:/var/lib/mysql
  #networks:
  #- chat_network  # Connects this service to the 'chat_network' for communication
  #ports:
  #- "6667:6667"  # Maps port 6667 on the host to port 6667 in the container (used for communication)

  # docker compose --profile chatservers up --build
  # docker compose --profile addressingserver up --build
  # docker compose --profile client create --build
  # docker compose run --rm --service-ports client

  addressingserver:
    image: addressingserver:latest
    container_name: addressingserver
    profiles: ["addressingserver", "main-single"]
    build:
      dockerfile: Dockerfile.addressingserver
    restart: on-failure
    environment:
      - AS_CLIENT_PORT=49800
      - AS_REPLICA_PORT=49801
      - AS_CHATSERVER_PORT=49802
      - AS_NETWORK=chat_network
      - AS_ROLE=PRIMARY
      # Host address is the Primary server address
      - HOST_ADDRESS=192.168.1.187
      # Set the public address as your Ipv4 Address
      - PUBLIC_ADDRESS=192.168.1.187
    ports: ["49800:49800", "49801:49801","49802:49802","5050:5050"]
    # network_mode: "host"
    networks:
      - chat_network
#    healthcheck:
#      test: [ "CMD", "sh", "/healthcheck.sh" ]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#    restart: on-failure

  addressingserver_replicas:
    image: addressingserver:latest
    profiles: ["serverreplicas"]
    environment:
      - AS_CLIENT_PORT=49800
      - AS_REPLICA_PORT=49801
      - AS_CHATSERVER_PORT=49802
      - AS_NETWORK=chat_network
      - AS_ROLE=BACKUP
      - HOST_ADDRESS=192.168.1.187
    networks:
      - chat_network
    deploy:
      replicas: 2

  chatserver:
    image: chatserver:latest
    container_name: chatserver
    profiles: ["chatserver", "main-single"]
    build:
      dockerfile: Dockerfile.chatserver
    ports:
      - "2424:2424"
      - "2425:2425"
    environment:
      - CS_PORT=2424
      - CS_PEER_PORT=2425
      - CS_ADDRSERVER_PORT=49802
      # Set host address to the address server ip
      - HOST_ADDRESS=192.168.1.187
      # Set address server ip to the address server ip
      - ADDRESS_SERVER_IP=192.168.1.187
      # The public address is your address
      - PUBLIC_ADDRESS=192.168.1.187
    # network_mode: "host"
    networks:
      - chat_network


  chatserver1:
    image: chatserver:latest
    container_name: chatserver1
    profiles: ["chatserver1", "chatservers"]
    build:
      dockerfile: Dockerfile.chatserver
    ports: 
      - "2432:2424"  
      - "2433:2425" 
    environment:
      - CS_PORT=2424
      - CS_PEER_PORT=2425
      - CS_ADDRSERVER_PORT=49802
      - ADDRESS_SERVER_IP=192.168.1.187
      - HOST_ADDRESS=192.168.1.187
      - PUBLIC_ADDRESS=192.168.1.187:2432
    networks:
      chat_network:
        ipv4_address: 172.20.0.10
    # volumes:
    #   - ./chatlogs:/app/src/main/java/com/Logs

  chatserver2:
    image: chatserver:latest
    container_name: chatserver2
    profiles: ["chatserver2", "chatservers"]
    build:
      dockerfile: Dockerfile.chatserver
    ports:
      - "2434:2424"   # new external port for client access
      - "2435:2425"   # new external port for peer connection
    environment:
      - CS_PORT=2424           # container still listens on 2424
      - CS_PEER_PORT=2425      # and 2425 internally
      - CS_ADDRSERVER_PORT=49802
      - HOST_ADDRESS=192.168.1.187
      - ADDRESS_SERVER_IP=192.168.1.187
      - PUBLIC_ADDRESS=192.168.1.187:2434
    networks:
      - chat_network

    # volumes:
    #   - ./chatlogs:/app/src/main/java/com/Logs

  # client:
  #   image: client:latest
  #   container_name: client
  #   profiles: ["client", "main-single"]
  #   build:
  #     dockerfile: Dockerfile.client
  #   ports: ["3000:3000",]
  #   environment:
  #     - CLIENT_PORT=3000
  #     - HOST_ADDRESS=client
  #     - ADDRESS_HOST=172.20.0.2
  #   networks:
  #     - chat_network
  #   tty: true        # You need these two lines to make the client interactive
  #   stdin_open: true # Non-optional for interactive shell input
  client1:
    image: client:latest
    container_name: client1
    profiles: ["client1", "clients"]
    build:
      dockerfile: Dockerfile.client
    ports: ["3000:3000"]
    environment:
      - CLIENT_PORT=3000
      # Host address is the Address server address
      - HOST_ADDRESS=192.168.1.187
      # Address server ip is the address server address
      - ADDRESS_SERVER_IP=192.168.1.187
    # network_mode: "host"
    networks:
      - chat_network
    tty: true
    stdin_open: true

  client2:
    image: client:latest
    container_name: client2
    profiles: ["client2", "clients"]
    build:
      dockerfile: Dockerfile.client
    ports: ["3002:3000"]
    environment:
      - CLIENT_PORT=3000
      - HOST_ADDRESS=client2
      - ADDRESS_HOST=172.20.0.2
    networks:
      chat_network:
        ipv4_address: 172.20.0.21
    tty: true
    stdin_open: true

networks:
  chat_network:
    driver: "bridge"
    ipam:
      config:
        - subnet: 172.20.0.0/16
# This is different from the volume we define in a service. This is how we can ensure that any data...configs:
# ... that is created during the build or execution of the container(s), IS NOT deleted when the container is removed.
# This is very powerful because it allows us to update our repository (new version), and in turn build new containers...configs:
# ... without losing the data (chat logs) from previous versions.
# volumes:
#   db-data:  # Defines a named volume (currently unused in this config but can be used for persistent storage)