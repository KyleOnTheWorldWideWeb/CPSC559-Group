services:
  client:
    image: openjdk:21-slim
    volumes:
      # Mount your local build folder into the container
      # Use forward slashes even on Windows!
      - ./build/libs:/app/libs
    working_dir: /app
    # Update 'client-all.jar' to whatever your gradle-generated jar name is
    command: java -jar libs/client-all.jar
    stdin_open: true
    tty: true